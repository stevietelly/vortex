<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Vortex options</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font: 13px/1.5 system-ui, sans-serif;
        color: #e5e7eb;
        background: #111318;
        padding: 24px;
        max-width: 460px;
      }
      h1 { font-size: 16px; margin-bottom: 4px; }
      p.hint { color: #9ca3af; font-size: 12px; margin-bottom: 20px; }
      label { display: block; font-size: 12px; margin: 14px 0 4px; color: #9ca3af; }
      select, input {
        width: 100%;
        background: #1c1f27;
        border: 1px solid #262a33;
        color: #e5e7eb;
        border-radius: 6px;
        padding: 7px 9px;
        font-size: 13px;
      }
      .row { display: flex; gap: 8px; margin-top: 18px; align-items: center; }
      button {
        background: #4f46e5;
        border: none;
        color: #fff;
        border-radius: 6px;
        padding: 7px 14px;
        font-size: 13px;
        cursor: pointer;
      }
      button.secondary { background: #1c1f27; border: 1px solid #262a33; }
      #result { font-size: 12px; color: #9ca3af; }
      #result.ok { color: #22c55e; }
      #result.err { color: #ef4444; }
    </style>
  </head>
  <body>
    <h1>Vortex</h1>
    <p class="hint">
      The extension sends page URLs and discovered videos to the Vortex app.
      "Auto" uses the local bridge when possible (bulk sends) and falls back to
      vortex:// links. Copy the bridge token from Vortex → Settings → Browser
      extension.
    </p>

    <label for="transport">Transport</label>
    <select id="transport">
      <option value="auto">Auto (bridge first, then vortex:// link)</option>
      <option value="deeplink">vortex:// link only</option>
      <option value="bridge">Local bridge only</option>
    </select>

    <label for="port">Bridge port</label>
    <input id="port" type="number" min="1" max="65535" />

    <label for="token">Bridge token</label>
    <input id="token" type="password" autocomplete="off" />

    <div class="row">
      <button id="save">Save</button>
      <button id="test" class="secondary">Test connection</button>
      <span id="result"></span>
    </div>

    <script src="options.js"></script>
  </body>
</html>
