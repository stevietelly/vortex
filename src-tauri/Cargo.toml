[package]
name = "Vortex-Downloader"
version = "0.2.0"
description = "A Fast Video Downloader"
authors = ["Stephen Telian", "Geliana"]
license = ""
repository = "https://github.com/stevietelly/vortex"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2.4.10"
tauri-plugin-single-instance = "2.4.5"
tiny_http = "0.12.0"
getrandom = "0.3"
url = "2"
